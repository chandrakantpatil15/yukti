server:
  port: 8081

spring:
  application:
    name: yukti
  main:
    web-application-type: reactive
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

aws:
  region: us-east-1
  credentials:
    use-default-chain: true

spring:
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/yukti_db
    username: yukti_user
    password: yukti_password

logging:
  level:
    com.cloudcostoptimizer: INFO
    software.amazon.awssdk: WARN
    org.springframework.r2dbc: DEBUG