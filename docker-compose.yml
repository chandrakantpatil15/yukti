services:
  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yukti-backend
    env_file:
      - .env.ports
    environment:
      DATABASE_URL: postgresql://yukti:yukti123@host.docker.internal:${POSTGRES_PORT:-5432}/yukti_finops?sslmode=disable
      PORT: ${BACKEND_PORT:-8081}
      JWT_SECRET: pfAsPNDzQc9j2rGEy4F+sJd0mP9IEEEhAZAZAblLf6Q=
      AWS_ACCESS_KEY_ID: 
      AWS_SECRET_ACCESS_KEY: 
      AWS_REGION: us-west-1
      FROM_EMAIL: chandrakantpatil1594@gmail.com
      ENVIRONMENT: development
      SKIP_AWS_VERIFICATION: false
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000},http://localhost:${GRAFANA_PORT:-3001}
    ports:
      - "${BACKEND_PORT:-8081}:${BACKEND_PORT:-8081}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ML Service
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: yukti-ml
    env_file:
      - .env.ports
    environment:
      PORT: ${ML_SERVICE_PORT:-8000}
    ports:
      - "${ML_SERVICE_PORT:-8000}:${ML_SERVICE_PORT:-8000}"
    volumes:
      - ml_models:/app/models

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yukti-frontend
    env_file:
      - .env.ports
    environment:
      REACT_APP_API_URL: http://localhost:${BACKEND_PORT:-8081}
      REACT_APP_YUKTI_AWS_ACCOUNT: 999888777666
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: true
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules

  # Prometheus (Monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: yukti-prometheus
    env_file:
      - .env.ports
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # Grafana (Dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: yukti-grafana
    env_file:
      - .env.ports
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning

volumes:
  prometheus_data:
  grafana_data:
  ml_models:
