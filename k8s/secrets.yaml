apiVersion: v1
kind: Secret
metadata:
  name: yukti-secrets
type: Opaque
data:
  # Base64 encoded values - replace with actual values
  # echo -n "r2dbc:postgresql://localhost:5432/yukti_db" | base64
  db-url: cjJkYmM6cG9zdGdyZXNxbDovL2xvY2FsaG9zdDo1NDMyL3l1a3RpX2Ri
  # echo -n "yukti_user" | base64
  db-username: eXVrdGlfdXNlcg==
  # echo -n "your_secure_password" | base64
  db-password: eW91cl9zZWN1cmVfcGFzc3dvcmQ=
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: yukti-config
data:
  application.yml: |
    server:
      port: 8090
    spring:
      application:
        name: yukti
      main:
        web-application-type: reactive
      threads:
        virtual:
          enabled: true
      r2dbc:
        pool:
          initial-size: 2
          max-size: 10
          max-idle-time: 30m
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus
      endpoint:
        health:
          show-details: always
      metrics:
        export:
          prometheus:
            enabled: true
    aws:
      region: ${AWS_REGION:us-east-1}
      credentials:
        use-default-chain: true
      cost-explorer:
        enabled: true
      ec2:
        rightsizing-enabled: true
    logging:
      level:
        com.cloudcostoptimizer: INFO
        software.amazon.awssdk: WARN