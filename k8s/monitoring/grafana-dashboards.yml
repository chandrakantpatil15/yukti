apiVersion: v1
kind: ConfigMap
metadata:
  name: yukti-dashboard
  namespace: monitoring
data:
  yukti-dashboard.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Yukti - Cloud Cost Optimizer",
        "tags": ["yukti", "java", "spring-boot"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "JVM Memory Usage",
            "type": "stat",
            "targets": [
              {
                "expr": "jvm_memory_used_bytes{application=\"cloud-cost-optimizer\"}",
                "legendFormat": "{{area}}"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "CPU Usage",
            "type": "stat",
            "targets": [
              {
                "expr": "process_cpu_usage{application=\"cloud-cost-optimizer\"}",
                "legendFormat": "CPU Usage"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
          },
          {
            "id": 3,
            "title": "HTTP Requests",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(http_server_requests_seconds_count{application=\"cloud-cost-optimizer\"}[5m])",
                "legendFormat": "{{method}} {{uri}}"
              }
            ],
            "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8}
          }
        ],
        "time": {"from": "now-1h", "to": "now"},
        "refresh": "5s"
      }
    }